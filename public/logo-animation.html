<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BharatKhoj — Logo Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.stage{position:relative;width:min(90vw,900px);aspect-ratio:2/1}
.icon,.full{mix-blend-mode:multiply;position:absolute;inset:0;margin:auto}
.icon{width:32%;top:0;bottom:0;animation:icon 3s cubic-bezier(.22,1,.36,1) forwards}
.full{width:100%;opacity:0;clip-path:inset(0 100% 0 0);animation:full 3s cubic-bezier(.65,0,.35,1) forwards}
.glow{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(0,96,240,.18),rgba(255,180,0,.1) 45%,transparent 70%);filter:blur(30px);animation:glow 3s ease-out forwards;opacity:0}

@keyframes icon{
  0%{opacity:0;transform:scale(.3) rotate(-20deg);filter:blur(10px)}
  22%{opacity:1;transform:scale(1.08) rotate(3deg);filter:blur(0)}
  35%{transform:scale(1) rotate(0)}
  50%{opacity:1;transform:scale(1)}
  62%{opacity:0;transform:scale(.95)}
  100%{opacity:0}
}
@keyframes full{
  0%,48%{opacity:0;clip-path:inset(0 100% 0 0)}
  52%{opacity:1;clip-path:inset(0 72% 0 0)}
  85%{clip-path:inset(0 0 0 0)}
  100%{opacity:1;clip-path:inset(0 0 0 0)}
}
@keyframes glow{
  0%{opacity:0;transform:scale(.5)}
  40%{opacity:1;transform:scale(1.1)}
  100%{opacity:.6;transform:scale(1)}
}

/* Action Buttons Bar at bottom */
.action-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:99}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 8px rgba(0,0,0,0.08);border:none;outline:none}
.btn-download{background:#168A45;color:#fff}
.btn-download:hover{background:#126f37;transform:translateY(-1px);box-shadow:0 4px 12px rgba(22,138,69,0.25)}
.btn-download:disabled{background:#88c7a1;cursor:not-allowed;transform:none}
.btn-replay{background:#fff;color:#333;border:1px solid #ddd}
.btn-replay:hover{background:#f8f9fa;border-color:#ccc;transform:translateY(-1px)}
#recorder-canvas{display:none}
</style></head><body>

<div class="stage" id="s">
  <div class="glow"></div>
  <img class="icon" id="anim-icon" src="/anim-logo-icon.png" alt="BharatKhoj">
  <img class="full" id="anim-full" src="/anim-logo-full.png" alt="BharatKhoj — India's First Search Engine">
</div>

<div class="action-bar">
  <button id="downloadBtn" class="btn btn-download" onclick="recordAndDownload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span id="btnText">Download Video</span>
  </button>
  <button class="btn btn-replay" onclick="replayAnimation()">
    ↺ Replay
  </button>
</div>

<canvas id="recorder-canvas" width="1280" height="720"></canvas>

<script>
function replayAnimation() {
  const s = document.getElementById('s');
  s.replaceWith(s.cloneNode(true));
}

async function recordAndDownload() {
  const btn = document.getElementById('downloadBtn');
  const btnText = document.getElementById('btnText');
  btn.disabled = true;
  btnText.innerText = '⏳ Creating Video (3s)...';

  // Restart DOM animation so visual sync stays nice
  replayAnimation();

  const canvas = document.getElementById('recorder-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Load actual logo images
  const iconImg = new Image();
  const fullImg = new Image();
  iconImg.src = '/anim-logo-icon.png';
  fullImg.src = '/anim-logo-full.png';

  await Promise.all([
    new Promise(res => { if(iconImg.complete) res(); else iconImg.onload = res; }),
    new Promise(res => { if(fullImg.complete) res(); else fullImg.onload = res; })
  ]);

  // Setup MediaRecorder from canvas stream
  const stream = canvas.captureStream(30);
  let mime = 'video/webm';
  if (MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')) {
    mime = 'video/mp4;codecs=avc1';
  } else if (MediaRecorder.isTypeSupported('video/mp4')) {
    mime = 'video/mp4';
  } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
    mime = 'video/webm;codecs=vp9';
  }

  const chunks = [];
  const recorder = new MediaRecorder(stream, { mimeType: mime });
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

  recorder.onstop = () => {
    const isMp4 = mime.includes('mp4');
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = isMp4 ? 'bharatkhoj-logo-animation.mp4' : 'bharatkhoj-logo-animation.webm';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    btn.disabled = false;
    btnText.innerText = '✅ Downloaded!';
    setTimeout(() => { btnText.innerText = 'Download Video'; }, 3000);
  };

  recorder.start();

  const startTime = performance.now();
  const duration = 3200; // 3.2 seconds

  function drawFrame(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);

    // 1. Clean White Background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // 2. Ambient Glow
    let glowAlpha = 0;
    if (t > 0.05 && t < 0.95) {
      glowAlpha = t < 0.4 ? (t / 0.4) * 0.25 : (1 - (t - 0.4) / 0.6) * 0.25;
      const glowGrad = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, 380);
      glowGrad.addColorStop(0, `rgba(0, 96, 240, ${glowAlpha})`);
      glowGrad.addColorStop(0.5, `rgba(255, 180, 0, ${glowAlpha * 0.7})`);
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, 0, W, H);
    }

    // 3. Icon Animation (0 to 1.8s)
    if (t < 0.62) {
      ctx.save();
      ctx.translate(W / 2, H / 2);

      let scale = 0.3;
      let rot = -20 * (Math.PI / 180);
      let opacity = 0;

      if (t < 0.22) {
        const prog = t / 0.22;
        scale = 0.3 + 0.78 * prog;
        rot = (-20 + 23 * prog) * (Math.PI / 180);
        opacity = prog;
      } else if (t < 0.35) {
        const prog = (t - 0.22) / 0.13;
        scale = 1.08 - 0.08 * prog;
        rot = (3 - 3 * prog) * (Math.PI / 180);
        opacity = 1;
      } else if (t < 0.50) {
        scale = 1;
        rot = 0;
        opacity = 1;
      } else {
        const prog = (t - 0.50) / 0.12;
        scale = 1 - 0.05 * prog;
        rot = 0;
        opacity = 1 - prog;
      }

      ctx.rotate(rot);
      ctx.scale(scale, scale);
      ctx.globalAlpha = Math.max(0, Math.min(1, opacity));

      const iconW = 280;
      const iconH = (iconImg.height / iconImg.width) * iconW;
      ctx.drawImage(iconImg, -iconW / 2, -iconH / 2, iconW, iconH);
      ctx.restore();
    }

    // 4. Full Logo Reveal (1.5s to 3.2s)
    if (t >= 0.48) {
      const fullW = 860;
      const fullH = (fullImg.height / fullImg.width) * fullW;
      const fullX = (W - fullW) / 2;
      const fullY = (H - fullH) / 2;

      let wipe = 0;
      if (t >= 0.85) {
        wipe = 1;
      } else {
        wipe = (t - 0.48) / (0.85 - 0.48);
      }

      ctx.save();
      // Clip from left to right
      ctx.beginPath();
      ctx.rect(fullX, fullY, fullW * wipe, fullH);
      ctx.clip();
      ctx.globalAlpha = Math.min(1, (t - 0.48) / 0.1);
      ctx.drawImage(fullImg, fullX, fullY, fullW, fullH);
      ctx.restore();
    }

    if (t < 1) {
      requestAnimationFrame(drawFrame);
    } else {
      setTimeout(() => recorder.stop(), 200);
    }
  }

  requestAnimationFrame(drawFrame);
}
</script>
</body></html>
