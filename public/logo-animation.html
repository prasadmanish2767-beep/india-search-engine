<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BharatKhoj — Logo Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
.stage{position:relative;width:min(90vw,900px);aspect-ratio:2/1}
.icon,.full{mix-blend-mode:multiply;position:absolute;inset:0;margin:auto}
.icon{width:32%;top:0;bottom:0;animation:icon 3s cubic-bezier(.22,1,.36,1) forwards}
.full{width:100%;opacity:0;clip-path:inset(0 100% 0 0);animation:full 3s cubic-bezier(.65,0,.35,1) forwards}
.glow{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(0,96,240,.18),rgba(255,180,0,.1) 45%,transparent 70%);filter:blur(30px);animation:glow 3s ease-out forwards;opacity:0}
@keyframes icon{0%{opacity:0;transform:scale(.3) rotate(-20deg);filter:blur(10px)}
22%{opacity:1;transform:scale(1.08) rotate(3deg);filter:blur(0)}
35%{transform:scale(1) rotate(0)}
50%{opacity:1;transform:scale(1)}
62%{opacity:0;transform:scale(.95)}100%{opacity:0}}
@keyframes full{0%,48%{opacity:0;clip-path:inset(0 100% 0 0)}
52%{opacity:1;clip-path:inset(0 72% 0 0)}
85%{clip-path:inset(0 0 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes glow{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.1)}100%{opacity:.6;transform:scale(1)}}

/* Action Buttons Bar at bottom */
.action-bar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:99}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.btn-download{background:#168A45;color:#fff;border:none}
.btn-download:hover{background:#126f37;transform:translateY(-1px);box-shadow:0 4px 12px rgba(22,138,69,0.25)}
.btn-replay{background:#fff;color:#333;border:1px solid #ddd}
.btn-replay:hover{background:#f8f9fa;border-color:#ccc;transform:translateY(-1px)}
</style></head><body>
<div class="stage" id="s">
<img class="icon" src="/anim-logo-icon.png" alt="BharatKhoj">
<img class="full" src="/anim-logo-full.png" alt="BharatKhoj — India's First Search Engine"></div>

<div class="action-bar">
  <a href="/bharatkhoj-logo-animation.mp4" download="bharatkhoj-logo-animation.mp4" class="btn btn-download">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download Video
  </a>
  <button class="btn btn-replay" onclick="const s=document.getElementById('s');s.replaceWith(s.cloneNode(true))">
    ↺ Replay
  </button>
</div>
</body></html>
