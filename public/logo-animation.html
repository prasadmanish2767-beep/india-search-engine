<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BharatKhoj — Logo Animation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:system-ui,sans-serif}
.stage{position:relative;width:min(90vw,900px);aspect-ratio:2/1}
.icon,.full{mix-blend-mode:multiply;position:absolute;inset:0;margin:auto}
.icon{width:32%;top:0;bottom:0;animation:icon 3s cubic-bezier(.22,1,.36,1) forwards}
.full{width:100%;opacity:0;clip-path:inset(0 100% 0 0);animation:full 3s cubic-bezier(.65,0,.35,1) forwards}
.glow{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(0,96,240,.18),rgba(255,180,0,.1) 45%,transparent 70%);filter:blur(30px);animation:glow 3s ease-out forwards;opacity:0}
@keyframes icon{0%{opacity:0;transform:scale(.3) rotate(-20deg);filter:blur(10px)}
22%{opacity:1;transform:scale(1.08) rotate(3deg);filter:blur(0)}
35%{transform:scale(1) rotate(0)}
50%{opacity:1;transform:scale(1)}
62%{opacity:0;transform:scale(.95)}100%{opacity:0}}
@keyframes full{0%,48%{opacity:0;clip-path:inset(0 100% 0 0)}
52%{opacity:1;clip-path:inset(0 72% 0 0)}
85%{clip-path:inset(0 0 0 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes glow{0%{opacity:0;transform:scale(.5)}40%{opacity:1;transform:scale(1.1)}100%{opacity:.6;transform:scale(1)}}
button{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 22px;border:1px solid #ddd;background:#fff;border-radius:999px;cursor:pointer;font-weight:600;color:#333}
</style></head><body>
<div class="stage" id="s">
<img class="icon" src="/anim-logo-icon.png" alt="BharatKhoj">
<img class="full" src="/anim-logo-full.png" alt="BharatKhoj — India's First Search Engine"></div>
<button onclick="const s=document.getElementById('s');s.replaceWith(s.cloneNode(true))">↺ Replay</button>
</body></html>
