<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BharatKhoj — 3s Logo Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0d14;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Ambient Tricolor Glow in Background */
    .glow-bg {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(0, 96, 240, 0.25) 0%,
        rgba(240, 43, 18, 0.15) 35%,
        rgba(0, 168, 68, 0.15) 70%,
        transparent 100%
      );
      filter: blur(60px);
      animation: pulseGlow 3s ease-out forwards;
      pointer-events: none;
    }

    /* Main Container */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    /* Logo Icon Animation (Scale + Elastic Pop) */
    .logo-icon {
      width: 140px;
      height: 140px;
      animation: iconEntrance 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center;
    }

    /* Magnifying Glass Sweep Effect */
    .magnifier {
      transform-origin: 85px 85px;
      animation: glassSweep 3s ease-in-out forwards;
    }

    /* BharatKhoj Brand Text Reveal */
    .brand-title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transform: translateY(18px);
      animation: titleReveal 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.8s;
    }

    .c-blue   { color: #0060F0; }
    .c-red    { color: #F02B12; }
    .c-yellow { color: #FFB800; }
    .c-green  { color: #00A844; }

    /* Tagline Reveal */
    .tagline {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #94a3b8;
      opacity: 0;
      transform: translateY(10px);
      animation: tagReveal 3s ease-out forwards;
      animation-delay: 1.4s;
    }

    /* Shimmer Light Bar across Logo */
    .shine-line {
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 100%
      );
      transform: rotate(25deg);
      animation: shinePass 3s ease-in-out forwards;
      animation-delay: 1.6s;
      pointer-events: none;
    }

    /* Replay Button for Testing */
    .replay-btn {
      position: absolute;
      bottom: 40px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    /* -------------------------------------------------------------
       KEYFRAME TIMELINES (Total Duration: 3.0 Seconds)
       0.0s - 0.8s : Icon emerges with smooth elastic scale & glow
       0.8s - 1.5s : Magnifying glass sweeps & titles slide in
       1.5s - 2.2s : Clean light-sweep (shine) across brand
       2.2s - 3.0s : Settles into rock-solid, sharp hero lockup
    -------------------------------------------------------------- */

    @keyframes iconEntrance {
      0% {
        opacity: 0;
        transform: scale(0.25) rotate(-15deg);
        filter: blur(12px);
      }
      30% {
        opacity: 1;
        transform: scale(1.12) rotate(2deg);
        filter: blur(0px);
      }
      50% {
        transform: scale(0.97) rotate(-1deg);
      }
      70% {
        transform: scale(1.02) rotate(0deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes glassSweep {
      0%, 25% {
        transform: rotate(-30deg) scale(0.85);
      }
      55% {
        transform: rotate(15deg) scale(1.15);
      }
      75% {
        transform: rotate(-4deg) scale(1.02);
      }
      100% {
        transform: rotate(0deg) scale(1);
      }
    }

    @keyframes titleReveal {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.95);
        filter: blur(6px);
      }
      50% {
        opacity: 1;
        transform: translateY(-2px) scale(1.02);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes tagReveal {
      0% {
        opacity: 0;
        transform: translateY(10px);
        letter-spacing: 1px;
      }
      60% {
        opacity: 0.9;
        letter-spacing: 4px;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 3.5px;
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.4);
        opacity: 0;
      }
      40% {
        transform: scale(1.15);
        opacity: 0.9;
      }
      100% {
        transform: scale(1);
        opacity: 0.7;
      }
    }

    @keyframes shinePass {
      0% {
        left: -60%;
        opacity: 0;
      }
      30% {
        opacity: 0.8;
      }
      100% {
        left: 140%;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Tricolor Background Glow -->
  <div class="glow-bg"></div>

  <!-- Stage -->
  <div class="stage" id="stage">
    <div class="shine-line"></div>

    <!-- BharatKhoj Tricolor Vector Icon -->
    <svg class="logo-icon" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Shadow Filter -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.35)" />
        </filter>
        <!-- Tricolor Gradients -->
        <linearGradient id="saffronGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FF512F" />
          <stop offset="100%" stop-color="#F02B12" />
        </linearGradient>
        <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#00C853" />
          <stop offset="100%" stop-color="#00A844" />
        </linearGradient>
        <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2979FF" />
          <stop offset="100%" stop-color="#0060F0" />
        </linearGradient>
      </defs>

      <!-- Main "B" Spine (Vertical Bar) -->
      <rect x="30" y="24" width="22" height="112" rx="11" fill="url(#saffronGrad)" filter="url(#shadow)" />

      <!-- Top Loop (Saffron to Yellow) -->
      <path d="M42 24 H84 C102 24 116 38 116 56 C116 74 102 88 84 88 H42 V24 Z" 
            fill="url(#saffronGrad)" />

      <!-- Bottom Loop (India Green) -->
      <path d="M42 78 H92 C112 78 128 94 128 114 C128 126 122 136 112 136 H42 V78 Z" 
            fill="url(#greenGrad)" />

      <!-- Central Cutouts for B Form -->
      <rect x="52" y="38" width="32" height="34" rx="8" fill="#0a0d14" />
      <rect x="52" y="92" width="40" height="32" rx="8" fill="#0a0d14" />

      <!-- Magnifying Glass Overlay (Royal Blue with Lens Reflection) -->
      <g class="magnifier">
        <!-- Lens Ring -->
        <circle cx="92" cy="74" r="28" stroke="url(#blueGrad)" stroke-width="12" fill="rgba(0, 96, 240, 0.12)" filter="url(#shadow)" />
        <!-- Lens Glass Specular Glint -->
        <path d="M78 62 C82 56 94 54 102 58" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85" />
        <!-- Glass Handle -->
        <line x1="112" y1="94" x2="138" y2="122" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />
      </g>
    </svg>

    <!-- BharatKhoj Multicolor Title -->
    <div class="brand-title">
      <span class="c-blue">B</span>
      <span class="c-red">h</span>
      <span class="c-yellow">a</span>
      <span class="c-blue">r</span>
      <span class="c-green">a</span>
      <span class="c-red">t</span>
      <span class="c-blue">K</span>
      <span class="c-yellow">h</span>
      <span class="c-red">o</span>
      <span class="c-green">j</span>
    </div>

    <!-- Official Tagline -->
    <div class="tagline">India's First Search Engine</div>
  </div>

  <button class="replay-btn" onclick="replay()">↺ Replay Animation</button>

  <script>
    function replay() {
      const stage = document.getElementById('stage');
      const clone = stage.cloneNode(true);
      stage.parentNode.replaceChild(clone, stage);
    }
  </script>
</body>
</html>
